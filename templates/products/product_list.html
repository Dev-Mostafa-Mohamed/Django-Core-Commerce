{% extends 'base.html' %}

{% block content %}

<h2 class="mb-4">Products</h2>
<form method="get" class="row g-2 mb-4 align-items-center">

    <!-- Search Input -->
    <div class="col-md-4">
        <input 
            type="text"
            name="q"
            class="form-control"
            placeholder="Search products..."
            value="{{ request.GET.q }}"
        >
    </div>

    <!-- Sort Dropdown -->
    <div class="col-md-1">
        <select name="sort" class="form-select">
            <option value="">Sort by</option>
            <option value="price_asc" {% if request.GET.sort == "price_asc" %}selected{% endif %}>
                Price: Low to High
            </option>
            <option value="price_desc" {% if request.GET.sort == "price_desc" %}selected{% endif %}>
                Price: High to Low
            </option>
        </select>
    </div>

    <!-- Button -->
    <div class="col-md-2">
        <button type="submit" class="btn btn-primary w-100">
            Search
        </button>
    </div>

</form>

<div class="row">

    {% for product in products %}
   <div class="col-md-3 mb-4">

    <div class="card h-100 shadow-sm position-relative">

        <!-- Wishlist Button -->
        {% if product.id in wishlist_ids %}
    <a href="{% url 'accounts:toggle_wishlist' product.id %}"
       class="btn p-0 position-absolute top-0 end-0 m-2 rounded-circle">
        ❤️
    </a>
{% else %}
    <a href="{% url 'accounts:toggle_wishlist' product.id %}"
       class="btn p-0 position-absolute top-0 end-0 m-2 rounded-circle">
        🤍
    </a>
{% endif %}

        <!-- Image -->
        {% if product.image %}
        <img src="{{ product.image.url }}"
             class="card-img-top"
             style="height:200px; object-fit:cover;">
        {% endif %}

        <!-- Body -->
        <div class="card-body">
            <h5 class="card-title">{{ product.name }}</h5>
            <p class="text-muted">{{ product.price }} EGP</p>

            <a href="{{ product.get_absolute_url }}"
               class="btn btn-primary btn-sm">
                View
            </a>

            <a href="{% url 'cart:add_to_cart' product.id %}"
               class="btn btn-success btn-sm">
                Add to Cart
            </a>
        </div>

    </div>

</div>
    {% endfor %}

</div>

{% endblock %}
