{% extends 'base.html' %}

{% block content %}

<div class="row">

    <div class="col-md-6">
        <img src="{{ product.image.url }}" class="img-fluid rounded shadow">
    </div>

    <div class="col-md-6">

        <h2>{{ product.name }}</h2>
        <h4 class="text-primary">{{ product.price }} EGP</h4>

        <p class="mt-3">{{ product.description }}</p>

        <p><strong>Category:</strong> {{ product.category.name }}</p>

        <a href="{% url 'cart:add_to_cart' product.id %}" class="btn btn-success">
    Add to Cart
</a>

    </div>

</div>

{% endblock %}
